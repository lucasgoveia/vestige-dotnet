name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - run: dotnet restore Vestige.slnx

      - run: dotnet build Vestige.slnx --configuration Release --no-restore

      - run: dotnet test Vestige.slnx --configuration Release --no-build

      - name: Pack
        run: |
          dotnet pack src/Vestige                          --configuration Release --no-build --output ./nupkgs -p:PackageVersion=${{ env.VERSION }}
          dotnet pack src/Vestige.Enrichers.Activity       --configuration Release --no-build --output ./nupkgs -p:PackageVersion=${{ env.VERSION }}
          dotnet pack src/Vestige.Enrichers.Environment    --configuration Release --no-build --output ./nupkgs -p:PackageVersion=${{ env.VERSION }}
          dotnet pack src/Vestige.Enrichers.HttpRequest    --configuration Release --no-build --output ./nupkgs -p:PackageVersion=${{ env.VERSION }}
          dotnet pack src/Vestige.Enrichers.HttpResponse   --configuration Release --no-build --output ./nupkgs -p:PackageVersion=${{ env.VERSION }}
          dotnet pack src/Vestige.Extensions.AspNetCore    --configuration Release --no-build --output ./nupkgs -p:PackageVersion=${{ env.VERSION }}
          dotnet pack src/Vestige.Extensions.Hosting       --configuration Release --no-build --output ./nupkgs -p:PackageVersion=${{ env.VERSION }}
          dotnet pack src/Vestige.Sinks.Console            --configuration Release --no-build --output ./nupkgs -p:PackageVersion=${{ env.VERSION }}
          dotnet pack src/Vestige.Sinks.Postgres           --configuration Release --no-build --output ./nupkgs -p:PackageVersion=${{ env.VERSION }}
          dotnet pack src/Vestige.Sinks.SqlServer          --configuration Release --no-build --output ./nupkgs -p:PackageVersion=${{ env.VERSION }}
          dotnet pack src/Vestige.Testing                  --configuration Release --no-build --output ./nupkgs -p:PackageVersion=${{ env.VERSION }}

      - name: Push to NuGet.org
        run: dotnet nuget push ./nupkgs/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
